<script>
  // KFT theme: apply the saved light/dark mode and sidebar state before the page paints (no flash).
  (function () {
    var d = document.documentElement, theme = 'light', nav = 'collapsed';
    try { theme = localStorage.getItem('kft-theme') || theme; nav = localStorage.getItem('kft-nav') || nav; } catch (e) {}
    if (theme === 'system') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.setAttribute('data-theme', theme);
    d.setAttribute('data-bs-theme', theme);
    if (nav === 'expanded') d.classList.add('nav-expanded');
  })();
</script>
