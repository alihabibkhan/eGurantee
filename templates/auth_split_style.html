    <style>
        /* Split sign-in layout (approved design) shared by Login, Forgot password and Reset password.
           Colours come from kft-theme.css. */
        body { margin: 0; min-height: 100vh; background: var(--surface); }
        .login { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; }
        .login-brand { background: linear-gradient(160deg, #0B2E1F 0%, #1A5E40 70%, #1F6E4B 100%); color: #fff;
                       padding: 48px 56px; display: flex; flex-direction: column; }
        .login-brand .brand-mark { display: flex; align-items: center; gap: 12px; }
        .login-brand .logo-chip { width: 52px; height: 52px; border-radius: 12px; background: #fff; display: grid; place-items: center; flex: none; }
        .login-brand .logo-chip img { width: 40px; }
        .login-brand .brand-mark b { font-size: 16px; letter-spacing: .3px; display: block; }
        .login-brand .brand-mark span { font-size: 12px; opacity: .78; }
        .login-brand h2 { font-family: var(--font-head); font-size: 38px; line-height: 1.15; font-weight: 700; margin-top: auto; max-width: 460px; color: #fff; }
        .login-brand p { opacity: .82; margin-top: 14px; max-width: 440px; font-size: 15px; }
        .login-brand .stats { display: flex; gap: 36px; margin-top: 40px; }
        .login-brand .stats b { display: block; font-size: 24px; font-weight: 700; }
        .login-brand .stats span { font-size: 12px; opacity: .75; }
        /* numbered steps (forgot / reset password) */
        .login-brand .steps { list-style: none; padding: 0; margin: 36px 0 0; max-width: 440px; }
        .login-brand .steps li { display: flex; gap: 14px; align-items: flex-start; font-size: 14px; opacity: .9; margin-bottom: 16px; }
        .login-brand .steps .n { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center;
                                 font-size: 13px; font-weight: 700; background: rgba(255,255,255,.12); color: #E0AE4F; }
        .login-brand .steps li.on .n { background: #E0AE4F; color: #0B2E1F; }
        .login-form { display: grid; place-items: center; padding: 40px 24px; }
        .login-box { width: 100%; max-width: 380px; }
        .login-box .mobile-logo { display: none; width: 140px; margin-bottom: 24px; }
        .login-box .icon-chip { width: 48px; height: 48px; border-radius: 12px; background: var(--green-50); color: var(--green-700);
                                display: grid; place-items: center; font-size: 22px; margin-bottom: 18px; }
        .login-box h1 { font-size: 28px; margin: 0; }
        .login-box .sub { color: var(--ink-3); margin: 4px 0 26px; }
        .login-box .form-control { height: 44px; }
        .login-box .pw-toggle { border-left: 0; cursor: pointer; }
        .login-box .input-group .form-control { border-right: 0; }
        .login-box .btn-primary { height: 46px; font-size: 14.5px; }
        .login-box .row-links { display: flex; justify-content: flex-end; font-size: 13px; margin: -4px 0 22px; }
        .login-box .back { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; font-size: 13.5px; }
        .login-box .hint { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
        .login-box .hint.bad { color: var(--bad); }
        .login-box .foot { margin-top: 36px; font-size: 12px; color: var(--ink-3); text-align: center; }
        .login-box .flash-alert { margin-top: 0 !important; margin-bottom: 18px; }
        .login-box .col-md-6 { width: 100%; }
        @media (max-width: 860px) {
            .login { grid-template-columns: 1fr; }
            .login-brand { display: none; }
            .login-box .mobile-logo { display: block; }
        }
    </style>
